[package]
name = "music-plugin-host"
version.workspace = true
edition.workspace = true
[dependencies]
music-core.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
anyhow.workspace = true
rquickjs = { version = "=0.14.0", features = ["loader"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
aes = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
url = "2"
rand = "0.8"
aes-gcm = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
hex = "0.4"
tempfile = "3"
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "=0.14.0", features = ["bindgen"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = {version="3",features=["sync-secret-service","crypto-rust"]}
[dev-dependencies]
tempfile = "3"
