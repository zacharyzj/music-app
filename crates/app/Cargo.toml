[package]
name = "music-app"
version.workspace = true
edition.workspace = true
[features]
ui-smoke = []
[lib]
name = "music_app_ui"
crate-type = ["rlib","cdylib"]
[dependencies]
music-core.workspace = true
music-library.workspace = true
music-plugin-host.workspace = true
music-player.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
directories = "6"
rand = "0.8"
tempfile = "3"
qrcode = {version="0.14",default-features=false,features=["svg"]}
image = {version="0.25",default-features=false,features=["png","jpeg","webp"]}
reqwest = {version="0.12",default-features=false,features=["blocking","rustls-tls"]}
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = {version="=1.19.1",default-features=false,features=["std","backend-winit","renderer-software","system-tray","unstable-winit-030","compat-1-2"]}
rfd = "0.15"
[target.'cfg(target_os = "android")'.dependencies]
slint = {version="=1.19.1",default-features=false,features=["std","backend-android-activity-06","renderer-software","compat-1-2"]}
[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features=["Win32_Foundation","Win32_Graphics_Gdi","Win32_UI_HiDpi","Win32_UI_Shell","Win32_UI_WindowsAndMessaging"]}
[dev-dependencies]
keyring = "3"
[target.'cfg(windows)'.dev-dependencies]
windows-sys = {version="0.61",features=["Win32_Foundation","Win32_Graphics_Dwm","Win32_UI_WindowsAndMessaging"]}
[build-dependencies]
slint-build = "=1.19.1"
