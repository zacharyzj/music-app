[workspace]
resolver = "2"
members = ["crates/core", "crates/plugin-sdk", "crates/plugin-host", "crates/library", "crates/player", "crates/app", "plugins/netease", "xtask"]
default-members = ["crates/app"]

[workspace.package]
version = "0.2.17"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
music-core = { path = "crates/core" }
music-plugin-sdk = { path = "crates/plugin-sdk" }
music-plugin-host = { path = "crates/plugin-host" }
music-library = { path = "crates/library" }
music-player = { path = "crates/player" }

[profile.release]
lto = "thin"
strip = "debuginfo"
